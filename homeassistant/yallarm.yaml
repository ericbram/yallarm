# Home Assistant integration for yallarm — REST sensors + rest_commands
# against the device's built-in web dashboard (src/main.cpp).
#
# Not a HACS/custom_component package — just reference YAML to paste into
# your own HA config (e.g. as a packages/yallarm.yaml with a top-level
# `homeassistant: packages: !include_dir_named packages`, or merged
# directly into configuration.yaml). `rest`/`rest_command` are YAML-only
# integrations (no config flow) as of HA 2026.7.
#
# Prereq: input_text.yall_arm_host helper holds the device IP
# (create once via Settings -> Devices & Services -> Helpers -> Text,
# or it already exists if this was set up via the HA MCP). Update that
# helper's value if the device's IP ever changes — no YAML edit needed.
#
# Post-edit: Developer Tools -> YAML -> Check Configuration, then
# Restart (first-time addition of the `rest`/`rest_command` domains
# needs a full restart; `rest.reload` covers later sensor edits).

sensor:
  - platform: rest
    name: Yall-ARM Status
    # rest_command below reads the IP from input_text.yall_arm_host;
    # this sensor's `resource` field is not reliably template-capable
    # across HA versions, so keep it a literal IP kept in sync with the helper.
    resource: http://192.168.0.117/status
    scan_interval: 30
    value_template: "{{ value_json.state }}"
    json_attributes:
      - wis_score
      - wis_pct
      - is_live
      - live_via_fallback
      - mode
      - bar_override
      - bar_override_pct
      - logo_override
      - logo_override_on
      - opacity
      - dark_mode
      - power_on

template:
  - sensor:
      - name: "Yall-ARM WIS Percent"
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.yall_arm_status', 'wis_pct') }}"
      - name: "Yall-ARM Opacity"
        unit_of_measurement: "%"
        state: "{{ state_attr('sensor.yall_arm_status', 'opacity') }}"
  - binary_sensor:
      - name: "Yall-ARM Live"
        state: "{{ state_attr('sensor.yall_arm_status', 'is_live') }}"
      - name: "Yall-ARM Dark Mode"
        state: "{{ state_attr('sensor.yall_arm_status', 'dark_mode') }}"
      - name: "Yall-ARM Power"
        device_class: power
        state: "{{ state_attr('sensor.yall_arm_status', 'power_on') }}"

rest_command:
  yallarm_override:
    url: "http://{{ states('input_text.yall_arm_host') }}/override"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: "level={{ level }}"

  yallarm_logo_on:
    url: "http://{{ states('input_text.yall_arm_host') }}/logo-on"
    method: POST

  yallarm_logo_off:
    url: "http://{{ states('input_text.yall_arm_host') }}/logo-off"
    method: POST

  yallarm_opacity:
    url: "http://{{ states('input_text.yall_arm_host') }}/opacity"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: "level={{ level }}"

  yallarm_dark_mode_on:
    url: "http://{{ states('input_text.yall_arm_host') }}/dark-mode-on"
    method: POST

  yallarm_dark_mode_off:
    url: "http://{{ states('input_text.yall_arm_host') }}/dark-mode-off"
    method: POST

  yallarm_power_on:
    url: "http://{{ states('input_text.yall_arm_host') }}/power-on"
    method: POST

  yallarm_power_off:
    url: "http://{{ states('input_text.yall_arm_host') }}/power-off"
    method: POST

  yallarm_reset:
    url: "http://{{ states('input_text.yall_arm_host') }}/reset"
    method: POST

  yallarm_test_audio:
    url: "http://{{ states('input_text.yall_arm_host') }}/test-audio"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: "url={{ url | default('') }}"

  yallarm_test_audio_stop:
    url: "http://{{ states('input_text.yall_arm_host') }}/test-audio-stop"
    method: POST
